# SonarQube Configuration for DesignSystemAndroid
# This file contains the project configuration for SonarQube analysis

# Project identification
sonar.projectKey=DesignSystemAndroid
sonar.organization=gabriel-do-carmo-97
sonar.projectName=Design System WGC Android
sonar.projectVersion=1.0.0

# Source code locations
sonar.sources=core/src/main,components/src/main,templates/src/main,navigation-flows/src/main,app/src/main
sonar.tests=core/src/test,components/src/test,templates/src/test,navigation-flows/src/test,app/src/test
sonar.sourceEncoding=UTF-8

# Exclude generated files and build artifacts
sonar.exclusions=**/build/**,**/generated/**,**/R.java,**/BuildConfig.java,**/**/*Companion*.kt,**/**/*_MembersInjector*.kt
sonar.test.exclusions=**/build/**,**/generated/**

# Kotlin-specific settings
sonar.kotlin.coveragePlugin=jacoco
sonar.coverage.jacoco.xmlReportPaths=**/build/reports/jacoco/jacocoTestReport/jacocoTestReport.xml

# Detekt reports integration
sonar.kotlin.detekt.reportPaths=**/build/reports/detekt/detekt.xml

# Android-specific settings
sonar.android.lint.report=**/build/reports/lint-results-*.xml

# Quality gate settings
sonar.qualitygate.wait=true

# Language-specific settings
sonar.kotlin.surefire.reportPaths=**/build/test-results/testDebugUnitTest/*.xml
sonar.junit.reportPaths=**/build/test-results/testDebugUnitTest/*.xml

# Analysis parameters
sonar.analysis.mode=publish
sonar.issuesReport.html.enable=true
sonar.issuesReport.json.enable=true