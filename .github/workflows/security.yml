name: Security Scanning

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    # Run security scans daily at 2 AM UTC
    - cron: '0 2 * * *'

permissions:
  contents: read
  security-events: write

jobs:
  # --- 1. DEPENDENCY SCANNING (SCA) ---
  dependency-scan:
    name: 🔍 Dependency Scanning (SCA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Run OWASP Dependency Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'DesignSystemAndroid'
          path: '.'
          format: 'HTML'
          out: 'reports'
          suppressionFile: 'dependency-check-suppressions.xml'
        
      - name: Upload Dependency Check Results
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-results
          path: reports/
        
      - name: Upload SARIF to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'reports/dependency-check-report.sarif'

  # --- 2. CODEQL SECURITY ANALYSIS ---
  codeql:
    name: 🔒 CodeQL Security Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [ 'kotlin', 'java' ]
    steps:
      - uses: actions/checkout@v4
      
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality
      
      - name: Autobuild
        uses: github/codeql-action/autobuild@v3
      
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{matrix.language}}"

  # --- 3. SECRET SCANNING ---
  secret-scan:
    name: 🔐 Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  # --- 4. ANDROID LINT SECURITY CHECKS ---
  android-lint:
    name: 🛡️ Android Lint Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - run: chmod +x gradlew
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
      
      - name: Run Android Lint
        run: ./gradlew lintDebug
      
      - name: Upload Lint Results
        uses: actions/upload-artifact@v7
        with:
          name: android-lint-results
          path: '**/build/reports/lint-results-*.xml'
      
      - name: Parse Lint Results for Security Issues
        uses: yutailang0119/action-android-lint@v3
        with:
          report-path: '**/build/reports/lint-results-*.xml'

  # --- 5. GRADLE DEPENDENCY UPDATES CHECK ---
  dependency-update:
    name: 📦 Dependency Updates Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - run: chmod +x gradlew
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
      
      - name: Check for Dependency Updates
        uses: gradle/gradle-build-action@v3
        with:
          arguments: dependencyUpdates -Drevision=release
      
      - name: Upload Dependency Update Report
        uses: actions/upload-artifact@v7
        with:
          name: dependency-update-report
          path: '**/build/dependencyUpdates/'