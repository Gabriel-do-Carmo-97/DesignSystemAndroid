name: Android CI/CD Pipeline (Hypergranular Pro)

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  # --- 1. VALIDAR TÍTULO DO PR (CONVENTIONAL COMMITS) ---
  semantic-pull-request:
    name: 🏷️ Validate PR Title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            docs
            test
            chore
            ci
            build
            perf
          requireScope: false

  # --- 2. DETECTAR MÓDULOS ALTERADOS ---
  detect-changes:
    name: 🔍 Detect Changed Modules
    runs-on: ubuntu-latest
    outputs:
      any_changed: ${{ steps.changed_modules.outputs.build_logic_any_changed == 'true' || steps.changed_modules.outputs.core_any_changed == 'true' || steps.changed_modules.outputs.components_any_changed == 'true' || steps.changed_modules.outputs.templates_any_changed == 'true' || steps.changed_modules.outputs.navigation_flows_any_changed == 'true' || steps.changed_modules.outputs.app_any_changed == 'true' }}
      build_logic: ${{ steps.changed_modules.outputs.build_logic_any_changed }}
      core: ${{ steps.changed_modules.outputs.core_any_changed }}
      components: ${{ steps.changed_modules.outputs.components_any_changed }}
      templates: ${{ steps.changed_modules.outputs.templates_any_changed }}
      navigation_flows: ${{ steps.changed_modules.outputs.navigation_flows_any_changed }}
      app: ${{ steps.changed_modules.outputs.app_any_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect changes per module
        id: changed_modules
        uses: tj-actions/changed-files@v47
        with:
          files_yaml: |
            build_logic:
              - build-logic/**
            core:
              - core/**
            components:
              - components/**
            templates:
              - templates/**
            navigation_flows:
              - navigation-flows/**
            app:
              - app/**

  # --- 3. CÁLCULO DE VERSÃO SEMÂNTICA (SEMVER REAL) ---
  calculate-version:
    name: 🔢 Calculate Semantic Version
    needs: detect-changes
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.semver.outputs.version }}
      version_tag: v${{ steps.semver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Calculate SemVer from Commit History
        id: semver
        uses: PaulHatch/semantic-version@v5.4.0
        with:
          tag_prefix: "v"
          major_pattern: "(MAJOR)"
          minor_pattern: "feat"
          bump_each_commit_patch_pattern: "fix|refactor"
          version_format: "${major}.${minor}.${patch}"

  # --- 4. QUALIDADE HIPERGRANULAR: DETEKT POR MÓDULO (PARALELO) ---
  detekt-matrix:
    name: 🧹 Detekt [:${{ matrix.module }}]
    needs: detect-changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: "core"
            filter: "core"
          - module: "components"
            filter: "components"
          - module: "templates"
            filter: "templates"
          - module: "navigation-flows"
            filter: "navigation_flows"
          - module: "app"
            filter: "app"
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x gradlew
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
      - name: Run Detekt on ${{ matrix.module }}
        run: ./gradlew :${{ matrix.module }}:detekt
      - name: Upload Detekt Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-reports-${{ matrix.module }}
          path: ${{ matrix.module }}/build/reports/detekt/

  # --- 5. TESTES HIPERGRANULARES: TESTES UNITÁRIOS POR MÓDULO (PARALELO) ---
  unit-tests-matrix:
    name: 🧪 Tests [:${{ matrix.module }}]
    needs: detect-changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: "core"
          - module: "components"
          - module: "templates"
          - module: "navigation-flows"
          - module: "app"
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x gradlew
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
      - name: Run Unit Tests for ${{ matrix.module }}
        run: ./gradlew :${{ matrix.module }}:testDebugUnitTest
      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.module }}
          path: ${{ matrix.module }}/build/reports/tests/testDebugUnitTest/

  # --- 6. REGRESSÃO VISUAL: SCREENSHOT TESTS ---
  screenshot-tests:
    name: 📸 Screenshot Tests [:app]
    needs: detect-changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x gradlew
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
      - name: Validate Screenshot Previews Regression
        continue-on-error: true
        run: ./gradlew validateDebugScreenshotTest
      - name: Upload Screenshot Test Reports & Diffs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-test-reports
          path: app/build/reports/screenshotTest/
          if-no-files-found: ignore

  # --- 7. BUILD HIPERGRANULAR: ASSEMBLE RELEASE POR BIBLIOTECA (PARALELO) ---
  build-aars-matrix:
    name: 📦 Assemble [:${{ matrix.module }}]
    needs: [detect-changes, calculate-version]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: "core"
            task: "assembleRelease"
            artifact_path: "core/build/outputs/aar/core-release.aar"
          - module: "components"
            task: "assembleRelease"
            artifact_path: "components/build/outputs/aar/components-release.aar"
          - module: "templates"
            task: "assembleRelease"
            artifact_path: "templates/build/outputs/aar/templates-release.aar"
          - module: "navigation-flows"
            task: "assembleRelease"
            artifact_path: "navigation-flows/build/outputs/aar/navigation-flows-release.aar"
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x gradlew
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
      - name: Assemble ${{ matrix.module }}
        run: ./gradlew :${{ matrix.module }}:${{ matrix.task }} -PVERSION_NAME=${{ needs.calculate-version.outputs.version_name }}
      - name: Upload ${{ matrix.module }} AAR
        uses: actions/upload-artifact@v4
        with:
          name: aar-${{ matrix.module }}
          path: ${{ matrix.artifact_path }}

  # --- 8. BUILD DO APP DE CATÁLOGO (APK DEBUG) ---
  build-catalog-app:
    name: 📱 Assemble Catalog App
    needs: [detect-changes, calculate-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x gradlew
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
      - name: Assemble Catalog App Debug APK
        run: ./gradlew :app:assembleDebug
      - name: Upload Catalog APK
        uses: actions/upload-artifact@v4
        with:
          name: catalog-app-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  # --- 9. DOCUMENTAÇÃO DOKKA NO GITHUB PAGES ---
  publish-docs:
    name: 📚 Publish Dokka Portal to GitHub Pages
    needs: [detect-changes, detekt-matrix, unit-tests-matrix]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: https://gabriel-do-carmo-97.github.io/DesignSystemAndroid/
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x gradlew
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
      - name: Generate Dokka HTML Docs
        run: ./gradlew dokkaHtmlMultiModule
      - name: Deploy Docs to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/dokka/htmlMultiModule

  # --- 10. PUBLICAÇÃO HIPERGRANULAR: PUBLICAR APENAS MÓDULOS ALTERADOS ---
  publish-modules:
    name: 🚀 Publish [:${{ matrix.module }}] (${{ needs.calculate-version.outputs.version_name }})
    needs: [detect-changes, calculate-version, detekt-matrix, unit-tests-matrix, screenshot-tests, build-aars-matrix]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: "core"
            key: "core"
            env_name: "core"
            doc_url: "https://gabriel-do-carmo-97.github.io/DesignSystemAndroid/core/"
          - module: "components"
            key: "components"
            env_name: "components"
            doc_url: "https://gabriel-do-carmo-97.github.io/DesignSystemAndroid/components/"
          - module: "templates"
            key: "templates"
            env_name: "templates"
            doc_url: "https://gabriel-do-carmo-97.github.io/DesignSystemAndroid/templates/"
          - module: "navigation-flows"
            key: "navigation_flows"
            env_name: "navigation-flows"
            doc_url: "https://gabriel-do-carmo-97.github.io/DesignSystemAndroid/navigation-flows/"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    environment:
      name: ${{ matrix.env_name }}
      url: ${{ matrix.doc_url }}
    steps:
      - uses: actions/checkout@v4
        if: needs.detect-changes.outputs[matrix.key] == 'true' || needs.detect-changes.outputs.any_changed == 'true'
      - run: chmod +x gradlew
        if: needs.detect-changes.outputs[matrix.key] == 'true' || needs.detect-changes.outputs.any_changed == 'true'
      - uses: actions/setup-java@v4
        if: needs.detect-changes.outputs[matrix.key] == 'true' || needs.detect-changes.outputs.any_changed == 'true'
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
        if: needs.detect-changes.outputs[matrix.key] == 'true' || needs.detect-changes.outputs.any_changed == 'true'
      - name: 📦 Publish ${{ matrix.module }}
        if: needs.detect-changes.outputs[matrix.key] == 'true' || needs.detect-changes.outputs.any_changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_NAME: ${{ needs.calculate-version.outputs.version_name }}
        run: ./gradlew :${{ matrix.module }}:publish -PVERSION_NAME=${{ needs.calculate-version.outputs.version_name }}

  # --- 11. CRIAR RELEASE NO GITHUB COM TODOS OS AARS PUBLICADOS ---
  release:
    name: 🏷️ Create Release (${{ needs.calculate-version.outputs.version_tag }})
    needs: [detect-changes, calculate-version, publish-modules]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download core AAR
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: aar-core
          path: release-aars/

      - name: Download components AAR
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: aar-components
          path: release-aars/

      - name: Download templates AAR
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: aar-templates
          path: release-aars/

      - name: Download navigation-flows AAR
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: aar-navigation-flows
          path: release-aars/

      - name: Configure GitHub Access
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

      - name: Create Git Tag & Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ needs.calculate-version.outputs.version_tag }}"
          git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
          git push origin "$TAG_NAME"
          
          AARS=$(find release-aars -name "*.aar" 2>/dev/null || true)
          
          gh release create "$TAG_NAME" \
            --title "Release $TAG_NAME" \
            --generate-notes \
            $AARS
