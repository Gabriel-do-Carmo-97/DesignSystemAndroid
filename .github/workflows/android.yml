name: Android CI/CD Pipeline (Hypergranular Pro)

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: write
  packages: write
  pages: write

jobs:
  # --- 1. VALIDAR TÍTULO DO PR (CONVENTIONAL COMMITS) ---
  semantic-pull-request:
    name: 🏷️ Validate PR Title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            docs
            test
            chore
          requireScope: false

  # --- 2. DETECTAR MÓDULOS ALTERADOS ---
  detect-changes:
    name: 🔍 Detect Changed Modules
    runs-on: ubuntu-latest
    outputs:
      any_changed: ${{ steps.changed_modules.outputs.core_ds_any_changed == 'true' || steps.changed_modules.outputs.design_system_any_changed == 'true' || steps.changed_modules.outputs.ds_templates_any_changed == 'true' || steps.changed_modules.outputs.app_any_changed == 'true' }}
      core_ds: ${{ steps.changed_modules.outputs.core_ds_any_changed }}
      design_system: ${{ steps.changed_modules.outputs.design_system_any_changed }}
      ds_templates: ${{ steps.changed_modules.outputs.ds_templates_any_changed }}
      app: ${{ steps.changed_modules.outputs.app_any_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect changes per module
        id: changed_modules
        uses: tj-actions/changed-files@v47
        with:
          files_yaml: |
            core_ds:
              - core-ds/**
            design_system:
              - design-system/**
            ds_templates:
              - ds-templates/**
            app:
              - app/**

  # --- 3. CÁLCULO DE VERSÃO SEMÂNTICA (SEMVER REAL) ---
  calculate-version:
    name: 🔢 Calculate Semantic Version
    needs: detect-changes
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.semver.outputs.version }}
      version_tag: v${{ steps.semver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Calculate SemVer from Commit History
        id: semver
        uses: PaulHatch/semantic-version@v5.4.0
        with:
          tag_prefix: "v"
          major_pattern: "(MAJOR)"
          minor_pattern: "feat"
          bump_each_commit_patch_pattern: "fix|refactor"
          version_format: "${major}.${minor}.${patch}"

  # --- 4. QUALIDADE HIPERGRANULAR: DETEKT POR MÓDULO (PARALELO) ---
  detekt-matrix:
    name: 🧹 Detekt [:${{ matrix.module }}]
    needs: detect-changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: "core-ds"
            filter: "core_ds"
          - module: "design-system"
            filter: "design_system"
          - module: "ds-templates"
            filter: "ds_templates"
          - module: "app"
            filter: "app"
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x gradlew
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
      - name: Run Detekt on ${{ matrix.module }}
        run: ./gradlew :${{ matrix.module }}:detekt

  # --- 5. TESTES HIPERGRANULARES: TESTES UNITÁRIOS POR MÓDULO (PARALELO) ---
  unit-tests-matrix:
    name: 🧪 Tests [:${{ matrix.module }}]
    needs: detect-changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: "core-ds"
          - module: "design-system"
          - module: "ds-templates"
          - module: "app"
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x gradlew
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
      - name: Run Unit Tests for ${{ matrix.module }}
        run: ./gradlew :${{ matrix.module }}:testDebugUnitTest

  # --- 6. REGRESSÃO VISUAL: SCREENSHOT TESTS ---
  screenshot-tests:
    name: 📸 Screenshot Tests [:app]
    needs: detect-changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x gradlew
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
      - name: Validate Screenshot Previews Regression
        continue-on-error: true
        run: ./gradlew validateDebugScreenshotTest

  # --- 7. BUILD HIPERGRANULAR: ASSEMBLE RELEASE POR BIBLIOTECA (PARALELO) ---
  build-aars-matrix:
    name: 📦 Assemble [:${{ matrix.module }}]
    needs: [detect-changes, calculate-version]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: "core-ds"
            task: "assembleRelease"
            artifact_path: "core-ds/build/outputs/aar/core-ds-release.aar"
          - module: "design-system"
            task: "assembleRelease"
            artifact_path: "design-system/build/outputs/aar/design-system-release.aar"
          - module: "ds-templates"
            task: "assembleRelease"
            artifact_path: "ds-templates/build/outputs/aar/ds-templates-release.aar"
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x gradlew
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
      - name: Assemble ${{ matrix.module }}
        run: ./gradlew :${{ matrix.module }}:${{ matrix.task }} -PVERSION_NAME=${{ needs.calculate-version.outputs.version_name }}
      - name: Upload ${{ matrix.module }} AAR
        uses: actions/upload-artifact@v4
        with:
          name: aar-${{ matrix.module }}
          path: ${{ matrix.artifact_path }}

  # --- 8. BUILD DO APP DE CATÁLOGO (APK DEBUG) ---
  build-catalog-app:
    name: 📱 Assemble Catalog App
    needs: [detect-changes, calculate-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x gradlew
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
      - name: Assemble Catalog App Debug APK
        run: ./gradlew :app:assembleDebug
      - name: Upload Catalog APK
        uses: actions/upload-artifact@v4
        with:
          name: catalog-app-apk
          path: app/build/outputs/apk/debug/app-debug.apk

  # --- 9. DOCUMENTAÇÃO DOKKA NO GITHUB PAGES ---
  publish-docs:
    name: 📚 Publish Dokka Portal to GitHub Pages
    needs: [detect-changes, detekt-matrix, unit-tests-matrix]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x gradlew
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
      - name: Generate Dokka HTML Docs
        run: ./gradlew dokkaHtmlMultiModule
      - name: Deploy Docs to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/dokka/htmlMultiModule

  # --- 10. PUBLICAÇÃO HIPERGRANULAR: PUBLICAR APENAS MÓDULOS ALTERADOS ---
  publish-modules:
    name: 🚀 Publish [:${{ matrix.module }}] (${{ needs.calculate-version.outputs.version_name }})
    needs: [detect-changes, calculate-version, detekt-matrix, unit-tests-matrix, screenshot-tests, build-aars-matrix]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: "core-ds"
            key: "core_ds"
          - module: "design-system"
            key: "design_system"
          - module: "ds-templates"
            key: "ds_templates"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: needs.detect-changes.outputs[matrix.key] == 'true' || needs.detect-changes.outputs.any_changed == 'true'
      - run: chmod +x gradlew
        if: needs.detect-changes.outputs[matrix.key] == 'true' || needs.detect-changes.outputs.any_changed == 'true'
      - uses: actions/setup-java@v4
        if: needs.detect-changes.outputs[matrix.key] == 'true' || needs.detect-changes.outputs.any_changed == 'true'
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
        if: needs.detect-changes.outputs[matrix.key] == 'true' || needs.detect-changes.outputs.any_changed == 'true'
      - name: 📦 Publish ${{ matrix.module }}
        if: needs.detect-changes.outputs[matrix.key] == 'true' || needs.detect-changes.outputs.any_changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_NAME: ${{ needs.calculate-version.outputs.version_name }}
        run: ./gradlew :${{ matrix.module }}:publish -PVERSION_NAME=${{ needs.calculate-version.outputs.version_name }}

  # --- 11. CRIAR RELEASE NO GITHUB COM TODOS OS AARS PUBLICADOS ---
  release:
    name: 🏷️ Create Release (${{ needs.calculate-version.outputs.version_tag }})
    needs: [detect-changes, calculate-version, publish-modules]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download core-ds AAR
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: aar-core-ds
          path: release-aars/

      - name: Download design-system AAR
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: aar-design-system
          path: release-aars/

      - name: Download ds-templates AAR
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: aar-ds-templates
          path: release-aars/

      - name: Configure GitHub Access
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

      - name: Create Git Tag & Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ needs.calculate-version.outputs.version_tag }}"
          git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
          git push origin "$TAG_NAME"
          
          AARS=$(find release-aars -name "*.aar" 2>/dev/null || true)
          
          gh release create "$TAG_NAME" \
            --title "Release $TAG_NAME" \
            --generate-notes \
            $AARS
