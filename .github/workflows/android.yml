name: Android CI/CD Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  semantic-pull-request:
    name: 🏷️ Validate PR Title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            docs
            test
            chore
          requireScope: false

  detect-changes:
    name: 🔍 Detect Changed Modules
    runs-on: ubuntu-latest
    outputs:
      any_changed: ${{ steps.changed_modules.outputs.any_changed }}
      all_changed_files: ${{ steps.changed_modules.outputs.all_changed_files }}
    steps:
      - uses: actions/checkout@v4
      - name: Detect changes
        id: changed_modules
        uses: tj-actions/changed-files@v47
        with:
          files: |
            design-system/**
            ds-templates/**
            core-ds/**

  build-and-test:
    name: 🧪 Build, Test & Lint
    needs: detect-changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Static Analysis, Tests, Screenshot Tests & Build with Gradle
        run: ./gradlew detekt test validateDebugScreenshotTest assembleDebug

      - name: ⬆️ Upload Debug AARs as Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: debug-aars
          path: |
            ./design-system/build/outputs/aar/design-system-debug.aar
            ./ds-templates/build/outputs/aar/ds-templates-debug.aar
            ./core-ds/build/outputs/aar/core-ds-debug.aar

      - name: ⬆️ Upload Release AARs as Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-aars
          path: |
            ./design-system/build/outputs/aar/design-system-release.aar
            ./ds-templates/build/outputs/aar/ds-templates-release.aar
            ./core-ds/build/outputs/aar/core-ds-release.aar

  publish:
    name: 📦 Publish and Release
    needs: [detect-changes, build-and-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.detect-changes.outputs.any_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: 📦 Publish core-ds if changed
        if: contains(needs.detect-changes.outputs.all_changed_files, 'core-ds/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :core-ds:publish

      - name: 📦 Publish design-system if changed
        if: contains(needs.detect-changes.outputs.all_changed_files, 'design-system/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :design-system:publish

      - name: 📦 Publish ds-templates if changed
        if: contains(needs.detect-changes.outputs.all_changed_files, 'ds-templates/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :ds-templates:publish

      - name: Configure GitHub Access
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

      - name: Create Git Tag & Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v0.0.${{ github.run_number }}"
          git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
          git push origin "$TAG_NAME"
          
          gh release create "$TAG_NAME" \
            --title "Release $TAG_NAME" \
            --notes "Release automático. Mudanças detectadas em: ${{ needs.detect-changes.outputs.all_changed_files }}." \
            ./design-system/build/outputs/aar/design-system-release.aar \
            ./ds-templates/build/outputs/aar/ds-templates-release.aar \
            ./core-ds/build/outputs/aar/core-ds-release.aar
