name: Android CI/CD Pipeline (Enterprise Pro)

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: write
  packages: write
  pages: write

jobs:
  # --- 1. VALIDAR TÍTULO DO PR (CONVENTIONAL COMMITS) ---
  semantic-pull-request:
    name: 🏷️ Validate PR Title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            docs
            test
            chore
          requireScope: false

  # --- 2. DETECTAR MÓDULOS ALTERADOS ---
  detect-changes:
    name: 🔍 Detect Changed Modules
    runs-on: ubuntu-latest
    outputs:
      any_changed: ${{ steps.changed_modules.outputs.any_changed }}
      all_changed_files: ${{ steps.changed_modules.outputs.all_changed_files }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect changes
        id: changed_modules
        uses: tj-actions/changed-files@v47
        with:
          files: |
            design-system/**
            ds-templates/**
            core-ds/**

  # --- 3. CÁLCULO DE VERSÃO SEMÂNTICA (SEMVER REAL BASEADA NAS MUDANÇAS) ---
  calculate-version:
    name: 🔢 Calculate Semantic Version
    needs: detect-changes
    runs-on: ubuntu-latest
    outputs:
      version_name: ${{ steps.semver.outputs.version }}
      version_tag: v${{ steps.semver.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Calculate SemVer from Commit History
        id: semver
        uses: PaulHatch/semantic-version@v5.4.0
        with:
          tag_prefix: "v"
          major_pattern: "(MAJOR)"
          minor_pattern: "feat"
          patch_pattern: "fix|refactor"
          format: "${major}.${minor}.${patch}"

  # --- 4. JOBS PARALELOS DE QUALIDADE E BUILD (FEEDBACK RÁPIDO) ---
  static-analysis:
    name: 🧹 Detekt & Static Analysis
    needs: detect-changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x gradlew
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
      - name: Run Detekt Static Analysis
        run: ./gradlew detekt

  unit-tests:
    name: 🧪 Unit Tests
    needs: detect-changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x gradlew
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
      - name: Run Unit Tests Across All Modules
        run: ./gradlew test

  screenshot-tests:
    name: 📸 Screenshot Tests
    needs: detect-changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x gradlew
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
      - name: Validate Screenshot Previews Regression
        run: ./gradlew validateDebugScreenshotTest

  build-aars:
    name: 📦 Assemble Release AARs
    needs: [detect-changes, calculate-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x gradlew
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
      - name: Assemble Release AARs with SemVer
        run: ./gradlew assembleRelease -PVERSION_NAME=${{ needs.calculate-version.outputs.version_name }}
      - name: ⬆️ Upload Release AARs as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-aars
          path: |
            ./design-system/build/outputs/aar/design-system-release.aar
            ./ds-templates/build/outputs/aar/ds-templates-release.aar
            ./core-ds/build/outputs/aar/core-ds-release.aar

  # --- 5. DOCUMENTAÇÃO DOKKA NO GITHUB PAGES ---
  publish-docs:
    name: 📚 Publish Dokka Portal to GitHub Pages
    needs: [detect-changes, static-analysis, unit-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x gradlew
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
      - name: Generate Dokka HTML Docs
        run: ./gradlew dokkaHtmlMultiModule
      - name: Deploy Docs to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/dokka/htmlMultiModule

  # --- 6. PUBLICAÇÃO PARALELA DE PACOTES COM VERSÃO SEMÂNTICA ---
  publish-modules:
    name: 📦 Publish ${{ matrix.module }} (${{ needs.calculate-version.outputs.version_name }})
    needs: [detect-changes, calculate-version, static-analysis, unit-tests, screenshot-tests, build-aars]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.detect-changes.outputs.any_changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: "core-ds"
            path_pattern: "core-ds/"
          - module: "design-system"
            path_pattern: "design-system/"
          - module: "ds-templates"
            path_pattern: "ds-templates/"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: contains(needs.detect-changes.outputs.all_changed_files, matrix.path_pattern)
      - run: chmod +x gradlew
        if: contains(needs.detect-changes.outputs.all_changed_files, matrix.path_pattern)
      - uses: actions/setup-java@v4
        if: contains(needs.detect-changes.outputs.all_changed_files, matrix.path_pattern)
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
        if: contains(needs.detect-changes.outputs.all_changed_files, matrix.path_pattern)
      - name: 📦 Publish ${{ matrix.module }}
        if: contains(needs.detect-changes.outputs.all_changed_files, matrix.path_pattern)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_NAME: ${{ needs.calculate-version.outputs.version_name }}
        run: ./gradlew :${{ matrix.module }}:publish -PVERSION_NAME=${{ needs.calculate-version.outputs.version_name }}

  # --- 7. CRIAR RELEASE NO GITHUB COM CHANGELOG AUTOMÁTICO ---
  release:
    name: 🏷️ Create Release (${{ needs.calculate-version.outputs.version_tag }})
    needs: [detect-changes, calculate-version, publish-modules]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.detect-changes.outputs.any_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Release AAR Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-aars
          path: release-aars/

      - name: Configure GitHub Access
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

      - name: Create Git Tag & Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ needs.calculate-version.outputs.version_tag }}"
          git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
          git push origin "$TAG_NAME"
          
          AARS=$(find release-aars -name "*.aar" 2>/dev/null || true)
          
          gh release create "$TAG_NAME" \
            --title "Release $TAG_NAME" \
            --generate-notes \
            $AARS
