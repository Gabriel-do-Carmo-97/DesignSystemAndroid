name: Android CI/CD Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  semantic-pull-request:
    name: 🏷️ Validate PR Title
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            docs
            test
            chore
          requireScope: false

  detect-changes:
    name: 🔍 Detect Changed Modules
    runs-on: ubuntu-latest
    outputs:
      any_changed: ${{ steps.changed_modules.outputs.any_changed }}
      all_changed_files: ${{ steps.changed_modules.outputs.all_changed_files }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Detect changes
        id: changed_modules
        uses: tj-actions/changed-files@v47
        with:
          files: |
            design-system/**
            ds-templates/**
            core-ds/**

  build-and-test:
    name: 🧪 Build, Test & Lint
    needs: detect-changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v3

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Static Analysis, Tests, Screenshot Tests & Assemble AARs
        run: ./gradlew detekt test validateDebugScreenshotTest assembleDebug assembleRelease

      - name: ⬆️ Upload Debug AARs as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: debug-aars
          path: |
            ./design-system/build/outputs/aar/design-system-debug.aar
            ./ds-templates/build/outputs/aar/ds-templates-debug.aar
            ./core-ds/build/outputs/aar/core-ds-debug.aar

      - name: ⬆️ Upload Release AARs as Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-aars
          path: |
            ./design-system/build/outputs/aar/design-system-release.aar
            ./ds-templates/build/outputs/aar/ds-templates-release.aar
            ./core-ds/build/outputs/aar/core-ds-release.aar

  publish-modules:
    name: 📦 Publish ${{ matrix.module }}
    needs: [detect-changes, build-and-test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.detect-changes.outputs.any_changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: "core-ds"
            path_pattern: "core-ds/"
          - module: "design-system"
            path_pattern: "design-system/"
          - module: "ds-templates"
            path_pattern: "ds-templates/"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        if: contains(needs.detect-changes.outputs.all_changed_files, matrix.path_pattern)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Grant execute permission for gradlew
        if: contains(needs.detect-changes.outputs.all_changed_files, matrix.path_pattern)
        run: chmod +x gradlew

      - name: Set up JDK 17
        if: contains(needs.detect-changes.outputs.all_changed_files, matrix.path_pattern)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle Cache
        if: contains(needs.detect-changes.outputs.all_changed_files, matrix.path_pattern)
        uses: gradle/actions/setup-gradle@v3

      - name: 🤖 Setup Android SDK
        if: contains(needs.detect-changes.outputs.all_changed_files, matrix.path_pattern)
        uses: android-actions/setup-android@v3

      - name: 📦 Publish ${{ matrix.module }}
        if: contains(needs.detect-changes.outputs.all_changed_files, matrix.path_pattern)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew :${{ matrix.module }}:publish

  release:
    name: 🏷️ Create Release
    needs: [detect-changes, build-and-test, publish-modules]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master' && needs.detect-changes.outputs.any_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Release AAR Artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-aars
          path: release-aars/

      - name: Configure GitHub Access
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

      - name: Create Git Tag & Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="v0.0.${{ github.run_number }}"
          git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
          git push origin "$TAG_NAME"
          
          AARS=$(find release-aars -name "*.aar" 2>/dev/null || true)
          
          gh release create "$TAG_NAME" \
            --title "Release $TAG_NAME" \
            --notes "Release automático. Mudanças detectadas em: ${{ needs.detect-changes.outputs.all_changed_files }}." \
            $AARS
