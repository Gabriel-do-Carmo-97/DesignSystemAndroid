name: Gradle Security Scanning

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  schedule:
    # Run weekly on Sundays at 3 AM UTC
    - cron: '0 3 * * 0'

permissions:
  contents: read
  security-events: write

jobs:
  # --- 1. GRADLE DEPENDENCY VULNERABILITY SCAN ---
  gradle-scan:
    name: 🔍 Gradle Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - run: chmod +x gradlew
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
      
      - name: Run Gradle Dependency Check
        run: ./gradlew dependencyCheckAnalyze --info
      
      - name: Upload Dependency Check Results
        uses: actions/upload-artifact@v4
        with:
          name: gradle-dependency-check-results
          path: '**/build/reports/dependency-check-report.html'
        
      - name: Upload Dependency Check SARIF
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: '**/build/reports/dependency-check-report.sarif'

  # --- 2. ANDROID BOM INTEGRITY CHECK ---
  bom-integrity:
    name: 🔒 Android BOM Integrity Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - run: chmod +x gradlew
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
      
      - name: Verify Android Compose BOM Integrity
        run: |
          ./gradlew --version
          echo "Checking Android Compose BOM integrity..."
          ./gradlew :components:dependencies --configuration debugRuntimeClasspath | grep compose-bom
      
      - name: Check for Known Vulnerable Versions
        run: |
          echo "Checking for known vulnerable dependency versions..."
          # Add specific checks for known CVEs in your dependencies
          if grep -r "4.4.0" gradle/libs.versions.toml; then
            echo "WARNING: Found potentially vulnerable version pattern"
            exit 1
          fi
          echo "No known vulnerable version patterns found"

  # --- 3. LICENSE COMPLIANCE CHECK ---
  license-check:
    name: ⚖️ License Compliance Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - run: chmod +x gradlew
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v3
      
      - name: Generate License Report
        run: ./gradlew :app:downloadLicenses --configuration debugRuntimeClasspath
      
      - name: Check License Compliance
        run: |
          echo "Checking license compliance..."
          # Add checks for disallowed licenses (GPL, AGPL, etc.)
          if find . -name "license*.txt" -exec grep -l "GPL" {} \; 2>/dev/null; then
            echo "WARNING: Found GPL licensed dependencies"
            # exit 1  # Uncomment to fail on GPL licenses
          fi
          echo "License compliance check completed"
      
      - name: Upload License Reports
        uses: actions/upload-artifact@v4
        with:
          name: license-reports
          path: '**/build/reports/licenses/'